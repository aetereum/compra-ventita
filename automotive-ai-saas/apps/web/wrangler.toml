# Automotive AI SaaS - Cloudflare Pages Config
# This file is used by Cloudflare Pages for deployment

# Build command
[build]
command = "npm run build"
publish = "apps/web/.next"

# Environment variables (set in Cloudflare Pages dashboard)
# NODE_VERSION = "20"
# NEXT_TELEMETRY_DISABLED = "1"

# Headers
[headers]
  # Security headers
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

  # Static assets caching
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

  # Images caching
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Redirects
[redirects]
  # Legacy routes if needed
  # source = "/old-path"
  # destination = "/new-path"
  # status = 301

# Functions (Edge Middleware)
[functions]
  # API routes handled by Next.js
  # For custom edge functions, create files in functions/ directory